server {
    listen 80;
    server_name aitalk.17design.fun;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aitalk/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aitalk.17design.fun;
    root /var/www/aitalk/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/aitalk.17design.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aitalk.17design.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/aitalk.access.log;
    error_log /var/log/nginx/aitalk.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        alias /var/www/aitalk/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
